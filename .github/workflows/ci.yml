name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Formatting
        run: nix flake check --no-update-lock-file
      - name: Shared design validation
        run: nix run --no-update-lock-file .#design-gate-check -- docs/design .
      - name: README snippets
        run: nix run --no-update-lock-file .#snips -- --check --commands deny README.md packages/retrace_frontend/README.md
      - name: Application and example tests
        run: nix develop --no-update-lock-file --command bash dev/check.sh
      - name: Independent Git consumers with published Hex parents
        # Gleam fetches branch refs; advertise the detached PR merge commit too.
        run: |
          git branch ci-consumer HEAD
          nix develop --no-update-lock-file --command bash dev/git-consumer-check.sh
